name: PKCS#11 / SoftHSM2 Integration Tests

on:
  push:
    paths:
      - 'src/hsm.rs'
      - 'src/signer.rs'
      - 'Cargo.toml'
      - '.github/workflows/softhsm2.yml'
  pull_request:
    paths:
      - 'src/hsm.rs'
      - 'src/signer.rs'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Test fixture, not a secret: it protects an ephemeral SoftHSM2 token created
  # and destroyed inside a throwaway runner. Kept in one place so the token
  # initialisation and the tests cannot disagree, which is what previously made
  # every login fail even when the slot was right.
  SOFTHSM2_PIN: cleitonq1234
  SOFTHSM2_SO_PIN: "00000000"
  SOFTHSM2_LABEL: CleitonQ-CI

jobs:
  pkcs11-softhsm2:
    name: PKCS#11 — SoftHSM2 (Ubuntu x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install SoftHSM2 and PKCS#11 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y softhsm2 opensc libsofthsm2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pkcs11-${{ hashFiles('Cargo.toml') }}

      - name: Configure SoftHSM2
        run: |
          mkdir -p /tmp/softhsm2-tokens
          cat > /tmp/softhsm2.conf << 'EOF'
          directories.tokendir = /tmp/softhsm2-tokens
          objectstore.backend = file
          log.level = DEBUG
          slots.removable = false
          EOF
          echo "SOFTHSM2_CONF=/tmp/softhsm2.conf" >> $GITHUB_ENV
          echo "SOFTHSM2_LIB=/usr/lib/softhsm/libsofthsm2.so" >> $GITHUB_ENV

      - name: Initialise SoftHSM2 token
        run: |
          # --free, not --slot 0: softhsm2-util does not leave the token in the
          # slot it is given. It allocates a fresh slot ID and the requested one
          # is left uninitialised, so anything that later assumes slot 0 fails
          # with "the specified slot ID is not valid". The tests discover the
          # slot by token label instead of being told it.
          softhsm2-util \
            --init-token \
            --free \
            --label "$SOFTHSM2_LABEL" \
            --pin "$SOFTHSM2_PIN" \
            --so-pin "$SOFTHSM2_SO_PIN"
          echo "Token initialised:"
          softhsm2-util --show-slots

      - name: Build with pkcs11 feature
        run: cargo build --features pkcs11

      # The pkcs11 feature was never linted anywhere, so warnings accumulated
      # unseen behind a job that failed before reaching them.
      - name: Clippy (pkcs11)
        run: cargo clippy --features pkcs11 --all-targets -- -D warnings

      - name: Run PKCS#11 integration tests
        run: |
          # Single-threaded on purpose. These tests share one SoftHSM2 token,
          # and each signer constructs its own PKCS#11 context whose Drop calls
          # C_Finalize; running them concurrently tears the library down under a
          # sibling test and segfaults instead of failing an assertion.
          cargo test --features pkcs11 -- \
            --include-ignored \
            --test-threads=1 \
            pkcs11_ \
            2>&1
        env:
          SOFTHSM2_CONF: /tmp/softhsm2.conf
          SOFTHSM2_LIB: /usr/lib/softhsm/libsofthsm2.so

      - name: Verify no unexpected key material in the environment
        run: |
          # SOFTHSM2_PIN and SOFTHSM2_SO_PIN are declared test fixtures for an
          # ephemeral token and are expected here. Anything else matching is not,
          # and fails the job rather than printing a warning nobody reads.
          leaked=$(env | grep -iE "pin|seed|secret|key" \
                       | grep -vE "^SOFTHSM2_(PIN|SO_PIN)=" || true)
          if [ -n "$leaked" ]; then
            echo "::error::unexpected key material in the environment:"
            echo "$leaked" | sed 's/=.*/=<redacted>/'
            exit 1
          fi
          echo "Clean: only the declared SoftHSM2 test fixtures are present."

  tpm2-swtpm:
    name: TPM2 — swtpm simulator (Ubuntu x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install swtpm and TPM2 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swtpm tpm2-tools libtss2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tpm2-${{ hashFiles('Cargo.toml') }}

      - name: Start swtpm simulator
        run: |
          mkdir -p /tmp/swtpm-state
          swtpm socket \
            --tpmstate dir=/tmp/swtpm-state \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --flags not-need-init \
            --tpm2 \
            --daemon
          sleep 1
          # Startup the TPM2
          tpm2_startup -c -T swtpm:port=2321
          echo "swtpm running on port 2321"

      - name: Build with tpm2 feature
        run: cargo build --features tpm2

      - name: Run TPM2 integration tests
        run: |
          cargo test --features tpm2 -- \
            --include-ignored \
            tpm2_swtpm_roundtrip \
            2>&1
        env:
          TPM2TOOLS_TCTI: swtpm:port=2321
