<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor Command Provenance — Live PoC</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#111722; --fg:#c9d1d9; --dim:#6b7684;
    --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; --line:#1d2430;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .stage{width:min(920px,100%)}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .dot{width:12px;height:12px;border-radius:50%}
  .title{font-size:15px;color:var(--dim)}
  .title b{color:var(--fg)}
  .term{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px; min-height:440px; overflow:hidden;
  }
  .cap{
    min-height:52px; margin:16px 2px 4px; color:var(--blue);
    font-size:16px; line-height:1.45; transition:opacity .3s;
  }
  .row{opacity:0; transform:translateY(6px); transition:all .4s; margin:2px 0; white-space:pre-wrap}
  .row.show{opacity:1; transform:none}
  .dim{color:var(--dim)} .green{color:var(--green)} .red{color:var(--red)}
  .amber{color:var(--amber)} .blue{color:var(--blue)}
  .chip{display:inline-block;padding:1px 8px;border-radius:5px;font-size:13px;font-weight:bold}
  .ok{background:rgba(63,185,80,.15);color:var(--green)}
  .bad{background:rgba(248,81,73,.15);color:var(--red)}
  .controls{margin-top:14px;text-align:center}
  button{
    background:#1f6feb;color:#fff;border:0;border-radius:7px;
    padding:9px 18px;font:inherit;cursor:pointer
  }
  button:hover{background:#388bfd}
  .foot{margin-top:10px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <span class="dot" style="background:#f85149"></span>
    <span class="dot" style="background:#d29922"></span>
    <span class="dot" style="background:#3fb950"></span>
    <span class="title"><b>Anchor command provenance</b> — quantum-safe, third-party verifiable</span>
  </div>

  <div class="term">
    <div id="log"></div>
    <div class="cap" id="cap"></div>
  </div>

  <div class="controls"><button id="replay">▶ Replay</button></div>
  <div class="foot">Real cleitonq-verify output · ML-DSA-87 + SHA3-256 · github.com/cleitonaugusto/CleitonQ</div>
</div>

<script>
const log = document.getElementById('log');
const cap = document.getElementById('cap');
let timers = [];

// Each step: [delay_ms, caption, [log lines]]
const steps = [
  [200,
   "A drone's flight records: 256 commands, each authenticated with HMAC-SHA3-256.",
   ['<span class="dim"># window of authenticated machine traffic</span>',
    'commands         : <span class="green">256</span>   each carrying a 32-byte MAC tag']],

  [2600,
   "One Anchor signs a SHA3-256 commitment over the whole window with ML-DSA-87 (post-quantum).",
   ['<span class="dim"># emit anchor</span>',
    'commitment       : SHA3-256(mac_0 || ... || mac_255)',
    'anchor signature : <span class="blue">ML-DSA-87</span>  ·  4695 bytes  ·  <span class="green">one per window</span>']],

  [3000,
   "An auditor — an insurer, a regulator, a court — verifies using only the public key. No operator trust needed.",
   ['<span class="dim"># a third party verifies the archive</span>']],

  [2600,
   "Case 1 — the intact archive. The signature and commitment match.",
   ['intact archive           <span class="chip ok">VERIFIED ✓</span>']],

  [2800,
   "Case 2 — the operator alters a single bit of one command after the fact.",
   ['tampered (1 bit flipped)  <span class="chip bad">REJECTED ✗</span>  <span class="dim">commitment mismatch — the archive was altered</span>']],

  [2800,
   "Case 3 — an old anchor is replayed with a stale sequence number.",
   ['replayed anchor           <span class="chip bad">REJECTED ✗</span>  <span class="dim">non-monotonic anchor nonce</span>']],

  [2800,
   "Case 4 — a forged signature from the wrong key.",
   ['wrong signing key         <span class="chip bad">REJECTED ✗</span>  <span class="dim">signature does not verify</span>']],

  [3200,
   "Tamper-evident, non-repudiable, third-party verifiable — and the evidence survives the quantum transition.",
   ['<span class="green"># all provenance properties hold</span>',
    '<span class="green">post-quantum · offline · no blockchain · one signature per window</span>']],
];

function clearAll(){ timers.forEach(clearTimeout); timers=[]; log.innerHTML=''; cap.textContent=''; }

function addLines(lines){
  lines.forEach(html=>{
    const d=document.createElement('div');
    d.className='row'; d.innerHTML=html; log.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('show')));
  });
}

function play(){
  clearAll();
  let t=0;
  steps.forEach(([delay,caption,lines])=>{
    t+=delay;
    timers.push(setTimeout(()=>{
      cap.style.opacity=0;
      setTimeout(()=>{ cap.textContent=caption; cap.style.opacity=1; },200);
      addLines(lines);
      log.scrollTop=log.scrollHeight;
    }, t));
  });
}

document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body>
</html>
