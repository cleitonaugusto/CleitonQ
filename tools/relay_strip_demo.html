<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROS2/DDS Authentication Stripping — Live PoC</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#111722; --fg:#c9d1d9; --dim:#6b7684;
    --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; --line:#1d2430;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .stage{width:min(920px,100%)}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .dot{width:12px;height:12px;border-radius:50%}
  .title{font-size:15px;color:var(--dim)}
  .title b{color:var(--fg)}
  .term{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px; min-height:420px; overflow:hidden;
  }
  .cap{
    min-height:52px; margin:16px 2px 4px; color:var(--blue);
    font-size:16px; line-height:1.45; transition:opacity .3s;
  }
  .row{opacity:0; transform:translateY(6px); transition:all .4s; margin:2px 0; white-space:pre-wrap}
  .row.show{opacity:1; transform:none}
  .dim{color:var(--dim)} .green{color:var(--green)} .red{color:var(--red)}
  .amber{color:var(--amber)} .blue{color:var(--blue)}
  .bar{display:inline-block;height:11px;border-radius:2px;vertical-align:middle}
  .b-cdr{background:var(--green)} .b-auth{background:var(--amber)} .b-gone{background:var(--red);opacity:.35}
  table{border-collapse:collapse;width:100%;margin-top:6px;font-size:14px}
  th,td{text-align:left;padding:4px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:normal}
  .verdict{color:var(--red);font-weight:bold}
  .fix{color:var(--green)}
  .controls{margin-top:14px;text-align:center}
  button{
    background:#1f6feb;color:#fff;border:0;border-radius:7px;
    padding:9px 18px;font:inherit;cursor:pointer
  }
  button:hover{background:#388bfd}
  .foot{margin-top:10px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <span class="dot" style="background:#f85149"></span>
    <span class="dot" style="background:#d29922"></span>
    <span class="dot" style="background:#3fb950"></span>
    <span class="title"><b>ROS2 / DDS authentication stripping</b> — live proof of concept</span>
  </div>

  <div class="term">
    <div id="log"></div>
    <div class="cap" id="cap"></div>
  </div>

  <div class="controls"><button id="replay">▶ Replay</button></div>
  <div class="foot">Real CycloneDDS output · CleitonQ · github.com/cleitonaugusto/CleitonQ</div>
</div>

<script>
const log = document.getElementById('log');
const cap = document.getElementById('cap');
let timers = [];

// Each step: [delay_ms, caption, [log lines]]
const steps = [
  [200,
   "A sender builds a standard ROS2 command (geometry_msgs/Twist).",
   ['<span class="dim"># sender serializes Twist to CDR</span>',
    'CDR payload      : <span class="green">52 bytes</span>  <span class="bar b-cdr" style="width:130px"></span>']],

  [2600,
   "It appends a 32-byte HMAC-SHA3-256 authentication tag after the message.",
   ['<span class="dim"># append application-layer auth tag</span>',
    'on the wire      : <span class="green">52</span> + <span class="amber">32</span> = <span class="amber">84 bytes</span>  '
    +'<span class="bar b-cdr" style="width:130px"></span><span class="bar b-auth" style="width:80px"></span>']],

  [2600,
   "The message crosses a DDS boundary — a bridge, or just the subscriber's deserializer.",
   ['<span class="dim"># DDS deserializes using the Twist schema...</span>']],

  [2400,
   "The subscriber receives all 84 raw bytes — but CDR deserialization reads only the 52 schema bytes.",
   ['raw RTPS payload : <span class="amber">84 bytes</span>  <span class="dim">(auth arrived over the wire)</span>',
    'after CDR decode : <span class="green">52 bytes</span>  <span class="dim">(typed Twist struct)</span>']],

  [3000,
   "The 32 auth bytes are silently gone. The application sees a valid command — with no error.",
   ['stripped         : <span class="red">32 bytes</span>  <span class="bar b-gone" style="width:80px"></span>',
    '<span class="verdict">auth material never reaches the application. no indication it existed.</span>']],

  [3200,
   "The same happens to every scheme — including a 4627-byte post-quantum signature.",
   ['<span class="dim"># tested against three authentication schemes (real CycloneDDS)</span>',
    '<table><tr><th>Auth scheme</th><th>Sent</th><th>Received (typed)</th><th>Result</th></tr>'
    +'<tr><td>HMAC-SHA3-256 (32 B)</td><td>84</td><td>52</td><td class="red">stripped ✗</td></tr>'
    +'<tr><td>Ed25519 sig (64 B)</td><td>116</td><td>52</td><td class="red">stripped ✗</td></tr>'
    +'<tr><td>ML-DSA-87 sig (4627 B)</td><td>4679</td><td>52</td><td class="red">stripped ✗</td></tr></table>']],

  [3400,
   "The fix: carry authentication as a typed ROS2 message on a parallel topic — DDS forwards it intact across every bridge hop.",
   ['<span class="fix"># fix: parallel-topic pattern (relay-transparent)</span>',
    '<span class="fix">/cmd_vel/auth  →  typed message, defined byte boundary  →  survives the bridge ✓</span>']],
];

function clearAll(){ timers.forEach(clearTimeout); timers=[]; log.innerHTML=''; cap.textContent=''; }

function addLines(lines){
  lines.forEach(html=>{
    const d=document.createElement('div');
    d.className='row'; d.innerHTML=html; log.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('show')));
  });
}

function play(){
  clearAll();
  let t=0;
  steps.forEach(([delay,caption,lines])=>{
    t+=delay;
    timers.push(setTimeout(()=>{
      cap.style.opacity=0;
      setTimeout(()=>{ cap.textContent=caption; cap.style.opacity=1; },200);
      addLines(lines);
      log.scrollTop=log.scrollHeight;
    }, t));
  });
}

document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body>
</html>
